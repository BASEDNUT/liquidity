<!DOCTYPE html>
<html>
<head>
    <title>Chat with our Agent</title>
    <style>
        /* Styles for the chat page */
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #f9f3e6;
        }
        .chat-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 10px rgba(139, 89, 43, 0.1);
        }
        .chat-header {
            display: flex;
            align-items: center;
            padding: 20px;
            background-color: #d4a676;
            border-radius: 12px 12px 0 0;
        }
        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 25px;
            margin-right: 15px;
        }
        .chat-header h1 {
            color: #4a2f1d;
            margin: 0;
            font-size: 24px;
        }
        .chat-messages {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
        }
        .message {
            display: flex;
            align-items: start;
            margin-bottom: 20px;
        }
        .message-avatar {
            width: 30px;
            height: 30px;
            border-radius: 15px;
            margin-right: 10px;
        }
        .message-content {
            background: #f0e6d9;
            padding: 12px;
            border-radius: 12px;
            max-width: 70%;
        }
        .chat-input {
            display: flex;
            padding: 20px;
            border-top: 1px solid #e0d5c1;
        }
        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #d4a676;
            border-radius: 6px;
            margin-right: 10px;
        }
        button {
            padding: 12px 24px;
            background: #8b572a;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover {
            background: #6d4321;
        }
    </style>
</head>
<body>
    <main>
        <h1>Chat with our Agent</h1>
        <div class="chat-container">
            <div class="chat-header">
                <img src="peanutoshi.png" alt="Peanutoshi" class="avatar">
                <h1>Peanutoshi NUTkamoto</h1>
            </div>
            <div class="chat-messages" id="chat-messages">
                <div class="message bot">
                    <img src="peanutoshi.png" alt="Peanutoshi" class="message-avatar">
                    <div class="message-content">Hello! I'm Peanutoshi NUTkamoto, your nutty AI assistant.</div>
                </div>
            </div>
            <div class="chat-input">
                <input type="text" id="user-input" placeholder="Type your message...">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </main>
    <script>
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const messages = document.getElementById('chat-messages');
            
            if (input.value.trim()) {
                const userMessage = input.value;
                
                messages.innerHTML += `
                    <div class="message user">
                        <div class="message-content">${userMessage}</div>
                    </div>
                `;
                
                messages.innerHTML += `
                    <div class="message bot" id="temp-message">
                        <img src="peanutoshi.png" alt="Peanutoshi" class="message-avatar">
                        <div class="message-content">Processing your request...</div>
                    </div>
                `;
                
                messages.scrollTop = messages.scrollHeight;
                input.value = '';

                try {
                    const response = await fetch('/api/chat', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ message: userMessage })
                    });
                    
                    const data = await response.json();
                    
                    const tempMessage = document.getElementById('temp-message');
                    tempMessage.innerHTML = `
                        <img src="peanutoshi.png" alt="Peanutoshi" class="message-avatar">
                        <div class="message-content">${data.reply}</div>
                    `;
                    tempMessage.removeAttribute('id');
                } catch (error) {
                    console.error('Error:', error);
                    const tempMessage = document.getElementById('temp-message');
                    tempMessage.innerHTML = `
                        <img src="peanutoshi.png" alt="Peanutoshi" class="message-avatar">
                        <div class="message-content">Unable to process your request. Please try again.</div>
                    `;
                    tempMessage.removeAttribute('id');
                }
            }
        }

        document.getElementById('user-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
