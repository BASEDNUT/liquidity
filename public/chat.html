<!DOCTYPE html>
<html>
<head>
    <title>Chat with Peanutoshi</title>
    <style>
        /* Styles for the chat page */
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #f9f3e6;
        }
        .chat-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 10px rgba(139, 89, 43, 0.1);
        }
        .chat-header {
            display: flex;
            align-items: center;
            padding: 20px;
            background-color: #d4a676;
            border-radius: 12px 12px 0 0;
        }
        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 25px;
            margin-right: 15px;
        }
        .chat-header h1 {
            color: #4a2f1d;
            margin: 0;
            font-size: 24px;
        }
        .chat-messages {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
        }
        .message {
            display: flex;
            align-items: start;
            margin-bottom: 20px;
        }
        .message-avatar {
            width: 30px;
            height: 30px;
            border-radius: 15px;
            margin-right: 10px;
        }
        .message-content {
            background: #f0e6d9;
            padding: 12px;
            border-radius: 12px;
            max-width: 70%;
        }
        .message.user .message-avatar {
            border: 2px solid #a97142; /* Peanut brown border for user avatar */
        }
        // New style for user chat bubble to make it visually distinct
        .message.user .message-content {
            background: #fff8e1; /* lighter background for user chat */
        }
        .chat-input {
            display: flex;
            padding: 20px;
            border-top: 1px solid #e0d5c1;
        }
        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #d4a676;
            border-radius: 6px;
            margin-right: 10px;
        }
        button {
            padding: 12px 24px;
            background: #8b572a;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover {
            background: #6d4321;
        }
        /* Modal styles */
        #settings-modal {
            display: none; 
            position: fixed; 
            top: 50%; left: 50%; 
            transform: translate(-50%, -50%);
            background: #f9f3e6; /* Updated background to match brand */
            border: 1px solid #d4a676; /* Updated border color */
            padding: 20px; 
            z-index: 1000;
            border-radius: 12px; /* Updated border radius */
            box-shadow: 0 2px 10px rgba(139, 89, 43, 0.1); /* Updated shadow */
        }
        #settings-modal h2 {
            color: #4a2f1d; /* Brand-aligned heading color */
        }
        #settings-modal form label {
            display: block;
            margin-bottom: 10px;
        }
        #settings-modal button {
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <main>
        <h1>Chat with our Peanutoshi</h1>
        <div class="chat-container">
            <div class="chat-header">
                <img src="/img/peanutoshi.png" alt="Peanutoshi" class="avatar">
                <h1>Peanutoshi NUTkamoto</h1>
                <!-- Added settings button with tooltip -->
                <button id="settings-btn" style="margin-left:auto;" title="Click to adjust advanced Venice API parameters">Nutty Settings</button>
            </div>
            <div class="chat-messages" id="chat-messages">
                <div class="message bot">
                    <img src="/img/peanutoshi.png" alt="Peanutoshi" class="message-avatar">
                    <div class="message-content">Hello! I'm Peanutoshi NUTkamoto, your nutty AI assistant.</div>
                </div>
            </div>
            <div class="chat-input">
                <input type="text" id="user-input" placeholder="Type your message...">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
        <!-- Settings modal -->
        <div id="settings-modal">
            <h2>Nutty Settings</h2>
            <form id="settings-form">
                <label title="Frequency Penalty: Number between -2.0 and 2.0. Positive values reduce repetition by penalizing frequently used tokens.">
                    Frequency Penalty:
                    <input type="number" step="0.1" id="frequency_penalty" value="0">
                </label>
                <label title="Presence Penalty: Number between -2.0 and 2.0. Positive values encourage new topics by reducing reliance on previous tokens.">
                    Presence Penalty:
                    <input type="number" step="0.1" id="presence_penalty" value="0">
                </label>
                <label title="Repetition Penalty: A factor (>=1.0) that discourages repeated phrases. 1.0 means no penalty; values >1 reduce repetition.">
                    Repetition Penalty:
                    <input type="number" step="0.1" id="repetition_penalty" value="1.2">
                </label>
                <label title="Temperature: Sampling temperature (0 to 2). Higher values produce more random outputs.">
                    Temperature:
                    <input type="number" step="0.1" id="temperature" value="0.7">
                </label>
                <label title="Max Tokens: The maximum tokens for completion, controlling output length and cost.">
                    Max Tokens:
                    <input type="number" id="max_tokens" value="123">
                </label>
                <label title="Max Temp: Maximum dynamic temperature scaling value (0 to 2).">
                    Max Temp:
                    <input type="number" step="0.1" id="max_temp" value="1.5">
                </label>
                <label title="Min Temp: Minimum dynamic temperature scaling value (0 to 2).">
                    Min Temp:
                    <input type="number" step="0.1" id="min_temp" value="0.1">
                </label>
                <label title="Max Completion Tokens: Upper limit for generated tokens including both output and reasoning tokens.">
                    Max Completion Tokens:
                    <input type="number" id="max_completion_tokens" value="123">
                </label>
                <label title="Top K: Number of highest probability tokens to consider for top-k filtering (>=0).">
                    Top K:
                    <input type="number" id="top_k" value="40">
                </label>
                <label title="Top P: Nucleus sampling cutoff (0 to 1). Only tokens comprising this cumulative probability mass are considered.">
                    Top P:
                    <input type="number" step="0.1" id="top_p" value="0.9">
                </label>
                <label title="Min P: Minimum probability threshold (0 to 1) for token inclusion.">
                    Min P:
                    <input type="number" step="0.1" id="min_p" value="0.05">
                </label>
                <label title="Stop: Specific sequence to terminate generation. Enter a custom text sequence or use the default.">
                    Stop:
                    <input type="text" id="stop" value="<string>">
                </label>
                <label title="Stop Token IDs: Comma-separated list of token IDs where generation will halt.">
                    Stop Token IDs:
                    <input type="text" id="stop_token_ids" value="151643,151645">
                </label>
                <button type="submit">Save Settings</button>
                <button type="button" id="close-settings">Close</button>
            </form>
            <p style="font-size: 0.9em; color: #4a2f1d;">Hover over each label for more information about the setting.</p>
        </div>
    </main>
    <script>
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const messages = document.getElementById('chat-messages');
            
            if (input.value.trim()) {
                const userMessage = input.value;
                // Updated user message to include correct pfp image from public/img/user.png
                messages.innerHTML += `
                    <div class="message user">
                        <img src="/img/user.png" alt="User Avatar" class="message-avatar">
                        <div class="message-content">${userMessage}</div>
                    </div>
                `;
                messages.innerHTML += `
                    <div class="message bot" id="temp-message">
                        <img src="/img/peanutoshi.png" alt="Peanutoshi" class="message-avatar">
                        <div class="message-content">Sending...</div>
                    </div>
                `;
                
                messages.scrollTop = messages.scrollHeight;
                input.value = '';
                
                try {
                    // Build settings using custom values if set
                    const customSettings = window.customSettings || {};
                    const response = await fetch('/api/chat', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            model: "llama-3.3-70b",
                            messages: [
                                { role: 'user', content: userMessage }
                            ],
                            venice_parameters: {
                                enable_web_search: "auto",
                                include_venice_system_prompt: true,
                                character_slug: "archon-01v"
                            },
                            frequency_penalty: customSettings.frequency_penalty ?? 0,
                            presence_penalty: customSettings.presence_penalty ?? 0,
                            repetition_penalty: customSettings.repetition_penalty ?? 1.2,
                            n: 1,
                            max_tokens: customSettings.max_tokens ?? 123,
                            max_temp: customSettings.max_temp ?? 1.5,
                            min_temp: customSettings.min_temp ?? 0.1,
                            max_completion_tokens: customSettings.max_completion_tokens ?? 123,
                            temperature: customSettings.temperature ?? 0.7,
                            top_k: customSettings.top_k ?? 40,
                            top_p: customSettings.top_p ?? 0.9,
                            min_p: customSettings.min_p ?? 0.05,
                            stop: customSettings.stop ?? "<string>",
                            stop_token_ids: customSettings.stop_token_ids ?? [151643,151645],
                            stream: false
                        })
                    });
                    
                    const data = await response.json();
                    console.log('API Response:', data);
                    
                    const tempMessage = document.getElementById('temp-message');
                    tempMessage.innerHTML = `
                        <img src="/img/peanutoshi.png" alt="Peanutoshi" class="message-avatar">
                        <div class="message-content">${data.reply || 'No reply available.'}</div>
                    `;
                    tempMessage.removeAttribute('id');
                } catch (error) {
                    console.error('Error:', error);
                    const tempMessage = document.getElementById('temp-message');
                    tempMessage.innerHTML = `
                        <img src="/img/peanutoshi.png" alt="Peanutoshi" class="message-avatar">
                        <div class="message-content">Unable to process your request. Please try again.</div>
                    `;
                    tempMessage.removeAttribute('id');
                }
            }
        }
        
        // Existing event listener for sending on Enter key
        document.getElementById('user-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Settings modal toggle and functionality
        document.getElementById('settings-btn').addEventListener('click', function(){
            document.getElementById('settings-modal').style.display = 'block';
        });
        document.getElementById('close-settings').addEventListener('click', function(){
            document.getElementById('settings-modal').style.display = 'none';
        });
        document.getElementById('settings-form').addEventListener('submit', function(e){
            e.preventDefault();
            window.customSettings = {
                frequency_penalty: parseFloat(document.getElementById('frequency_penalty').value),
                presence_penalty: parseFloat(document.getElementById('presence_penalty').value),
                repetition_penalty: parseFloat(document.getElementById('repetition_penalty').value),
                temperature: parseFloat(document.getElementById('temperature').value),
                max_tokens: parseInt(document.getElementById('max_tokens').value),
                max_temp: parseFloat(document.getElementById('max_temp').value),
                min_temp: parseFloat(document.getElementById('min_temp').value),
                max_completion_tokens: parseInt(document.getElementById('max_completion_tokens').value),
                top_k: parseInt(document.getElementById('top_k').value),
                top_p: parseFloat(document.getElementById('top_p').value),
                min_p: parseFloat(document.getElementById('min_p').value),
                stop: document.getElementById('stop').value,
                stop_token_ids: document.getElementById('stop_token_ids').value.split(',').map(Number)
            };
            document.getElementById('settings-modal').style.display = 'none';
        });
    </script>
</body>
</html>
