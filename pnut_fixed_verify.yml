        - generic [ref=e282]:
          - paragraph [ref=e283]: "📐 Advanced: Root-Indexed Constant-Mean Market Maker"
          - paragraph [ref=e284]: pNUT couples endogenous network assets with exogenous reserves in a reflexive AMM. The following is theoretical analysis, not financial advice.
          - generic [ref=e285]:
            - generic [ref=e286]:
              - paragraph [ref=e287]: Root-Indexed AMM
              - paragraph [ref=e288]:
                - text: pNUT couples
                - emphasis [ref=e289]: endogenous
                - text: network assets (NUT, SNUT) with
                - emphasis [ref=e290]: exogenous
                - text: reserve assets (cbETH, cbBTC) in a reflexive AMM network. The basket's invariant links internal scarcity dynamics to external market prices.
            - generic [ref=e291]:
              - paragraph [ref=e292]: Basketized Liquidity Index
              - paragraph [ref=e293]:
                - text: pNUT converts NUT from a
                - emphasis [ref=e294]: singleton meme-root
                - text: into an
                - emphasis [ref=e295]: indexable market object
                - text: with forced coherence — the pool's constant-mean invariant continuously pushes weights toward target.
            - generic [ref=e296]:
              - paragraph [ref=e297]: BPT as Pseudo-Oracle
              - paragraph [ref=e298]:
                - text: The pool can act as a
                - emphasis [ref=e299]: local pseudo-oracle
                - text: — it encodes useful market state. But because the pool contains both exogenous reserves (cbETH, cbBTC) and endogenous ecosystem assets (NUT, SNUT), its spot prices and naive BPT NAV are
                - strong [ref=e300]: manipulable via forced trading
                - text: and circular when used as oracle truth. The pool should be treated as an
                - emphasis [ref=e301]: endogenous state sensor
                - text: ", not an exogenous truth oracle."
            - generic [ref=e302]:
              - paragraph [ref=e303]: Forced Rebalancing Pressure
              - paragraph [ref=e304]:
                - text: The
                - emphasis [ref=e305]: constant-mean invariant
                - text: creates continuous rebalancing pressure that links NUT's scarcity dynamics to blue-chip crypto markets. Every trade in the pool moves weights, and every weight gap is an arbitrage opportunity.
          - generic [ref=e306]:
            - paragraph [ref=e307]: "Solution: Oracle Graph"
            - paragraph [ref=e308]:
              - text: Treat the pool as
              - strong [ref=e309]: one node in a robust oracle graph
              - text: ", not a standalone source of truth. Use external feeds for exogenous assets (cbETH, cbBTC), multi-venue TWAP/median aggregation for endogenous assets (NUT, SNUT), invariant-based BPT valuation, Vault reentrancy checks, liquidity thresholds, and circuit breakers. This converts the pool from a manipulable price source into a resilient state sensor."
