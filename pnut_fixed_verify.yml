        - generic [ref=e212]:
          - paragraph [ref=e213]: 🧠 How It Works
          - paragraph [ref=e214]: pNUT is powered by Balancer's weighted-pool mechanics. Here is how the basket maintains its target ratios.
          - generic [ref=e215]:
            - generic [ref=e216]:
              - paragraph [ref=e217]: a. Constant-Mean AMM
              - paragraph [ref=e218]:
                - text: Balancer's
                - emphasis [ref=e219]: weighted pool
                - text: uses a constant-mean invariant — the geometric weighted mean of token balances stays constant. This targets 25/25/25/25 but lets weights drift as prices move, creating natural rebalancing through trades.
            - generic [ref=e220]:
              - paragraph [ref=e221]: b. BPT Valuation
              - paragraph [ref=e222]:
                - emphasis [ref=e223]: BPT
                - text: value = (underlying balances × market prices) / total BPT supply. Balancer explicitly warns this is
                - strong [ref=e224]: informational and manipulable
                - text: "if naively used as an on-chain oracle. For safer on-chain valuation: use"
                - emphasis [ref=e225]: getActualSupply()
                - text: (not raw totalSupply), check Vault reentrancy, and use invariant-based weighted-pool valuation rather than raw balance × price.
            - generic [ref=e226]:
              - paragraph [ref=e227]: c. NAV Arbitrage
              - paragraph [ref=e228]:
                - text: If BPT market price drifts from
                - emphasis [ref=e229]: NAV
                - text: (Net Asset Value — the sum of underlying values per BPT), arbitrageurs mint or redeem BPT to restore parity. This keeps pNUT priced close to its intrinsic basket value.
            - generic [ref=e230]:
              - paragraph [ref=e231]: d. Forced Coherence
              - paragraph [ref=e232]:
                - text: The basket creates
                - emphasis [ref=e233]: arbitrage pressure
                - text: linking NUT ecosystem tokens with blue-chip reserves. When NUT or SNUT drift in weight, traders swap them in or out of the pool, connecting their prices to cbETH and cbBTC markets.
